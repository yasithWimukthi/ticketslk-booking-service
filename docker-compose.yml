version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: ticket-postgres

    environment:
      POSTGRES_DB: ticketdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

    ports:
      - "5433:5432"

  redis:
    image: redis:7

    container_name: ticket-redis

    ports:
      - "6379:6379"